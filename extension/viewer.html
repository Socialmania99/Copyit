<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copyit preview</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="viewer">
<header class="lb-bar">
  <div class="lb-title"><b id="vTitle">Preview</b><small id="vSub"></small></div>
  <span class="spacer"></span>
  <button class="btn sm" id="vOpen" hidden>Open in new tab</button>
  <button class="btn sm" id="vDl" hidden>Download</button>
  <button class="btn sm" id="vCopy" hidden>Copy</button>
</header>
<main id="vBody" class="lb-body"><p class="v-msg">Loading…</p></main>
<div id="vToast" role="status"></div>
<script src="lib.js"></script>
<script src="viewer.js"></script>
</body>
</html>
