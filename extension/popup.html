<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copyit</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="popup">

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f43f5e"/><stop offset=".55" stop-color="#a21caf"/><stop offset="1" stop-color="#4338ca"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#lg)"/><rect x="11" y="9" width="18" height="22" rx="4" fill="#fff" fill-opacity=".96"/><rect x="15" y="7" width="10" height="5" rx="2" fill="#fff"/><path d="M15 18h10M15 22h10M15 26h6" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <div>
      <h1>Copyit</h1>
      <p><svg class="i xs" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Private · saved on this device</p>
    </div>
  </div>
  <div class="tools"><button id="themeBtn" class="ib lg" title="Switch theme"><span class="sw"></span></button><button id="openDashboard" class="ib lg" title="Open full dashboard"><svg class="i" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></button><button id="donate" class="ib lg donate" title="Support Copyit"><svg class="i" viewBox="0 0 24 24"><path d="M12 20.5s-8-4.7-8-10.4A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 8 2.5c0 5.7-8 10.4-8 10.4z"/></svg></button></div>
</header>

<div class="toolbar">
  <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg><input id="search" type="search" placeholder="Search clips, #tags, types" autocomplete="off"></label>
  <button id="saveClipboard" class="btn primary" title="Read the clipboard and save it"><span class="spin"></span><svg class="i" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="3"/><path d="M9 4V3h6v1M12 9v6M9.5 12.5L12 15l2.5-2.5"/></svg><span>Save clipboard</span></button>
</div>

<nav class="seg" id="filterChips" aria-label="Filter">
  <span class="thumb"></span>
  <button class="on" data-filter="all">All <b id="statTotal">0</b></button>
  <button data-filter="pinned">Pinned <b id="statPinned">0</b></button>
  <button data-filter="favorites">Starred <b id="statStarred">0</b></button>
</nav>

<nav class="chips" id="typeChips" aria-label="Type">
  <button class="on" data-type="all">All types</button>
  <button data-type="text"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>Text</button>
  <button data-type="link"><svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Links</button>
  <button data-type="code"><svg class="i" viewBox="0 0 24 24"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></svg>Code</button>
</nav>
<div class="tagbar" id="tagBar" hidden></div>
<div class="tagbar foldbar" id="folderBar"></div>

<p class="hint"><svg class="i xs" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg><span>Press <kbd>Ctrl</kbd>+<kbd>V</kbd> to save what you copied, or use Save clipboard. <kbd>Alt</kbd>+<kbd>1–9</kbd> copies a clip.</span></p>

<section id="list" class="list"></section>

<button class="fab" data-add title="Add text"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="bottom"><button id="popSettings" class="link-btn" title="Open settings, including the danger zone">Settings</button><span id="count"></span></div>

<dialog id="addDialog">
  <form method="dialog" id="addForm">
    <h2>Add text</h2>
    <p>Type or paste anything you want to keep.</p>
    <textarea id="addText" placeholder="Enter text to save…" rows="5"></textarea>
    <div class="dlg-foot"><span class="kbd">Ctrl + Enter to save</span><span class="spacer"></span><button type="button" class="btn sm" id="addCancel">Cancel</button><button type="submit" class="btn primary sm" id="addSave">Save</button></div>
  </form>
</dialog>
<div id="toasts" aria-live="polite"></div>
<script src="lib.js"></script>
<script src="qrcode.js"></script>
<script src="app.js"></script>
<script src="share.js"></script>
</body>
</html>
